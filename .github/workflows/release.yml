name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          VERSION="0.$(grep '^VERSION=' version.properties | cut -d= -f2 | tr -d '\r')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "Kalapod-v${VERSION}-debug.apk" Kalapod.apk
          cp "Kalapod-v${VERSION}-debug.apk" "Kalapod-v${VERSION}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: کالاپاد ${{ env.VERSION }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          files: |
            Kalapod.apk
            Kalapod-v${{ env.VERSION }}.apk
          make_latest: true
